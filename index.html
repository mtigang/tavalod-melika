<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تولدت مبارک ملیکا 🎂</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: white;
            position: relative;
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .cake {
            font-size: 120px;
            animation: bounce 2s infinite;
            margin-bottom: 20px;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 15px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.3);
            background: linear-gradient(to right, #fff, #ffecd2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px #fff, 0 0 30px #ff6b6b; }
            to { text-shadow: 0 0 30px #fff, 0 0 40px #feca57; }
        }

        .subtitle {
            font-size: 1.8rem;
            margin-bottom: 40px;
            opacity: 0.95;
            font-weight: 300;
        }

        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px 30px;
            margin: 30px auto;
            max-width: 600px;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            animation: fadeInUp 1s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message {
            font-size: 1.4rem;
            line-height: 2;
            margin-bottom: 30px;
        }

        .hearts {
            font-size: 2.5rem;
            margin: 20px 0;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .btn {
            display: inline-block;
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            color: white;
            padding: 18px 45px;
            border-radius: 50px;
            font-size: 1.3rem;
            font-weight: 700;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(255, 107, 107, 0.4);
            margin: 10px;
        }

        .btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 35px rgba(255, 107, 107, 0.6);
        }

        .balloons {
            position: absolute;
            font-size: 40px;
            animation: float 6s ease-in-out infinite;
            opacity: 0.8;
        }

        .balloon1 { top: 10%; left: 5%; animation-delay: 0s; }
        .balloon2 { top: 20%; right: 8%; animation-delay: 1s; }
        .balloon3 { top: 60%; left: 10%; animation-delay: 2s; }
        .balloon4 { top: 70%; right: 5%; animation-delay: 3s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(5deg); }
        }

        .age-box {
            display: inline-block;
            background: rgba(255,255,255,0.25);
            padding: 15px 40px;
            border-radius: 20px;
            font-size: 2rem;
            font-weight: 700;
            margin: 20px 0;
            border: 2px solid rgba(255,255,255,0.4);
        }

        footer {
            margin-top: 50px;
            font-size: 1rem;
            opacity: 0.8;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .cake { font-size: 80px; }
            .subtitle { font-size: 1.3rem; }
            .message { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <canvas id="confetti-canvas"></canvas>

    <div class="balloons balloon1">🎈</div>
    <div class="balloons balloon2">🎈</div>
    <div class="balloons balloon3">🎉</div>
    <div class="balloons balloon4">🎁</div>

    <div class="container">
        <div class="cake">🎂</div>
        <h1>تولدت مبارک ملیکا!</h1>
        <p class="subtitle">Happy Birthday Melika 💖</p>

        <div class="card">
            <div class="hearts">💕 ✨ 🌸</div>
            <p class="message">
                عزیز دلم ملیکا<br>
                امیدوارم سال جدید زندگیت پر از شادی، موفقیت و لحظه‌های قشنگ باشه.<br>
                همیشه بخند و بدرخش 🌟
            </p>
            
            <div class="age-box">
                سال جدید مبارک 🎊
            </div>

            <button class="btn" onclick="launchConfetti()">🎉 جشن بگیر!</button>
            <button class="btn" onclick="playMusic()" id="musicBtn">🎵 آهنگ تولد</button>
        </div>

        <footer>
            ساخته شده با ❤️ برای ملیکا
        </footer>
    </div>

    <audio id="birthdaySong" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Confetti system
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const confetti = [];
        const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff', '#5f27cd', '#01a3a4', '#f368e0'];

        class ConfettiPiece {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height - canvas.height;
                this.size = Math.random() * 10 + 5;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.speed = Math.random() * 3 + 2;
                this.angle = Math.random() * 360;
                this.spin = Math.random() * 10 - 5;
            }

            update() {
                this.y += this.speed;
                this.x += Math.sin(this.angle * Math.PI / 180);
                this.angle += this.spin;
                if (this.y > canvas.height) {
                    this.y = -20;
                    this.x = Math.random() * canvas.width;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle * Math.PI / 180);
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
                ctx.restore();
            }
        }

        function initConfetti() {
            for (let i = 0; i < 150; i++) {
                confetti.push(new ConfettiPiece());
            }
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            confetti.forEach(c => {
                c.update();
                c.draw();
            });
            requestAnimationFrame(animateConfetti);
        }

        function launchConfetti() {
            for (let i = 0; i < 50; i++) {
                confetti.push(new ConfettiPiece());
            }
            // Create burst effect
            for (let i = 0; i < 100; i++) {
                const p = new ConfettiPiece();
                p.x = canvas.width / 2;
                p.y = canvas.height / 2;
                p.speed = Math.random() * 15 + 5;
                confetti.push(p);
            }
        }

        let isPlaying = false;
        function playMusic() {
            const audio = document.getElementById('birthdaySong');
            const btn = document.getElementById('musicBtn');
            if (isPlaying) {
                audio.pause();
                btn.textContent = '🎵 آهنگ تولد';
            } else {
                audio.play().catch(e => console.log('Audio play failed'));
                btn.textContent = '⏸️ توقف آهنگ';
            }
            isPlaying = !isPlaying;
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Start
        initConfetti();
        animateConfetti();

        // Auto confetti every few seconds
        setInterval(() => {
            if (Math.random() > 0.7) launchConfetti();
        }, 4000);
    </script>
</body>
</html>
